<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e">
<title>무역점 내선번호</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#0f766e;--brand2:#14b8a6;--red:#e11d48;--amber:#d97706}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{max-width:920px;margin:auto;padding:18px 14px 48px}.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:24px 20px;border-radius:24px;box-shadow:0 12px 30px #0f766e33;display:flex;justify-content:space-between;align-items:center;gap:12px}.hero h1{margin:0 0 5px;font-size:24px}.hero p{margin:0;opacity:.9;font-size:12px}.admin-open{border:1px solid #ffffff66;background:#ffffff20;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}.search{position:sticky;top:0;z-index:4;padding:13px 0;background:linear-gradient(var(--bg) 78%,transparent)}.searchbox{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 15px}.searchbox input{border:0;outline:0;width:100%;font-size:15px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 13px;flex-wrap:wrap}.count{font-size:12px;font-weight:800;color:var(--muted)}.filters{display:flex;gap:6px}.filter,.small{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}.filter.active{background:var(--brand);color:#fff;border-color:var(--brand)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.card.unused{opacity:.62}.name{font-size:15px;font-weight:900}.meta{font-size:11px;color:var(--muted);margin-top:5px}.row{display:flex;align-items:center;gap:7px;margin-top:7px}.badge{font-size:9px;font-weight:900;border-radius:999px;padding:4px 7px;background:#ccfbf1;color:#0f766e}.badge.unused{background:#e5e7eb;color:#6b7280}.call{background:var(--brand);color:#fff;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:900;white-space:nowrap}.call.off{background:#9ca3af;pointer-events:none}.empty{text-align:center;background:#fff;border:1px dashed var(--line);border-radius:18px;padding:40px;color:var(--muted)}.modal{position:fixed;inset:0;z-index:20;background:#111827cc;display:none;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}.panel{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:24px;padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:15px}.panel-head h2{margin:0;font-size:19px}.close{border:0;background:#f3f4f6;border-radius:10px;padding:8px 11px;cursor:pointer}.loginbox{max-width:360px;margin:35px auto}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:10px;font-weight:900;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;outline:0}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:#fff}.dark{background:#1f2937;color:#fff}.danger{background:#fff1f2;color:var(--red)}.amber{background:#fffbeb;color:var(--amber)}.admin-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.admin-tools label{display:inline-flex;align-items:center}.admin-tools input[type=file]{display:none}.formgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr .8fr auto;gap:8px;align-items:end;background:#f9fafb;padding:12px;border-radius:16px;margin-bottom:15px}.admin-list{display:grid;gap:8px}.admin-row{display:grid;grid-template-columns:.7fr .7fr 1.5fr 1.3fr .7fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px}.admin-row .actions{display:flex;gap:5px}.mini{border:0;border-radius:9px;padding:7px 9px;font-size:10px;font-weight:900;cursor:pointer}.statusmsg{font-size:11px;color:var(--muted);margin:8px 2px}.notice{background:#fffbeb;color:#92400e;border:1px solid #fde68a;padding:11px;border-radius:12px;font-size:11px;line-height:1.5;margin-bottom:13px}@media(max-width:680px){.grid{grid-template-columns:1fr}.hero h1{font-size:20px}.formgrid{grid-template-columns:1fr 1fr}.formgrid .wide{grid-column:1/-1}.admin-row{grid-template-columns:1fr 1fr}.admin-row .actions{grid-column:1/-1}.panel{padding:15px}}
</style>
</head>
<body>
<main class="wrap"><section class="hero"><div><h1>무역점 내선번호</h1><p>번호, 층, 사용자, 부서로 검색하세요.</p></div><button class="admin-open" onclick="openAdmin()">관리자</button></section><div class="search"><div class="searchbox"><span>🔍</span><input id="q" type="search" placeholder="예: 6011, 8F, 영업2파트"></div></div><div class="toolbar"><div id="count" class="count">불러오는 중...</div><div class="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="active">사용중</button><button class="filter" data-filter="unused">미사용</button></div></div><section id="list" class="grid"></section></main>
<div id="adminModal" class="modal"><section class="panel"><div class="panel-head"><h2>내선번호 관리자</h2><button class="close" onclick="closeAdmin()">닫기</button></div><div id="adminLogin" class="loginbox"><div class="field"><label>관리자 PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN 입력"></div><button class="btn primary" style="width:100%" onclick="adminLogin()">접속</button><p class="statusmsg">초기 PIN: 6011</p></div><div id="adminBody" style="display:none"><div class="notice">변경 내용은 이 브라우저에서 즉시 미리보기됩니다. 직원 사이트 전체에 반영하려면 <b>JSON 다운로드</b> 후 GitHub의 <b>extensions.json</b>을 교체하세요.</div><div class="admin-tools"><label class="btn primary">엑셀 업로드<input id="excelFile" type="file" accept=".xlsx,.xls,.csv"></label><label class="btn dark">JSON 업로드<input id="jsonFile" type="file" accept=".json"></label><button class="btn amber" onclick="downloadTemplate()">엑셀 양식</button><button class="btn dark" onclick="downloadJson()">JSON 다운로드</button><button class="btn danger" onclick="resetLocal()">초기 데이터로 복원</button></div><div class="formgrid"><div class="field"><label>내선번호</label><input id="fNumber" inputmode="numeric" maxlength="4"></div><div class="field"><label>층</label><input id="fFloor"></div><div class="field"><label>사용자</label><input id="fUser"></div><div class="field"><label>부서</label><input id="fDept"></div><div class="field"><label>상태</label><select id="fStatus"><option>사용중</option><option>미사용</option></select></div><button id="saveBtn" class="btn primary" onclick="saveItem()">추가</button></div><div class="field"><label>관리목록 검색</label><input id="adminQ" placeholder="번호, 층, 사용자, 부서, 상태"></div><div id="adminCount" class="statusmsg"></div><div id="adminList" class="admin-list"></div></div></section></div>
<script>
let baseData=[],data=[],filter='all',editing='';const $=id=>document.getElementById(id),clean=v=>String(v??'').trim(),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const unused=e=>clean(e.status)==='미사용'||clean(e.user)==='미사용';
function norm(e){let number=clean(e.number).replace(/[^0-9]/g,'').slice(-4),isOff=unused(e);return{number,fullNumber:clean(e.fullNumber)||`2142-${number}`,floor:isOff?'-':clean(e.floor),user:isOff?'미사용':clean(e.user),department:isOff?'':clean(e.department),status:isOff?'미사용':'사용중'}}
function saveLocal(){localStorage.setItem('tel_admin_data',JSON.stringify(data))}function render(){let t=$('q').value.trim().toLowerCase(),arr=data.map(norm).filter(e=>e.number&&(!t||Object.values(e).some(v=>String(v).toLowerCase().includes(t))));if(filter==='active')arr=arr.filter(e=>e.status==='사용중');if(filter==='unused')arr=arr.filter(e=>e.status==='미사용');arr.sort((a,b)=>a.number.localeCompare(b.number,'ko',{numeric:true}));$('count').textContent=`총 ${arr.length}개 내선`;$('list').innerHTML=arr.length?arr.map(e=>{let off=e.status==='미사용',tel=e.fullNumber.replace(/\D/g,'');return `<article class="card ${off?'unused':''}"><div><div class="name">${esc(e.user||'사용자 미지정')}</div><div class="meta">${esc(e.floor||'-')} · ${esc(e.department||'부서 없음')}</div><div class="row"><span class="badge ${off?'unused':''}">${e.status}</span><b>${e.number}</b></div></div><a class="call ${off?'off':''}" href="${off?'#':'tel:'+tel}">☎ ${e.number}</a></article>`}).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}
function openAdmin(){$('adminModal').classList.add('on')}function closeAdmin(){$('adminModal').classList.remove('on')}function adminLogin(){if($('pin').value!=='6011')return alert('PIN이 맞지 않습니다.');$('adminLogin').style.display='none';$('adminBody').style.display='block';renderAdmin()}
function renderAdmin(){let t=$('adminQ').value.trim().toLowerCase(),arr=data.map(norm).filter(e=>!t||Object.values(e).some(v=>String(v).toLowerCase().includes(t)));$('adminCount').textContent=`관리 대상 ${arr.length}건`;$('adminList').innerHTML=arr.map(e=>`<div class="admin-row"><b>${e.number}</b><span>${esc(e.floor)}</span><span>${esc(e.user)}</span><span>${esc(e.department||'-')}</span><span>${e.status}</span><div class="actions"><button class="mini amber" onclick="editItem('${e.number}')">수정</button><button class="mini danger" onclick="disableItem('${e.number}')">미사용</button><button class="mini danger" onclick="deleteItem('${e.number}')">삭제</button></div></div>`).join('')}
function clearForm(){editing='';['fNumber','fFloor','fUser','fDept'].forEach(x=>$(x).value='');$('fStatus').value='사용중';$('saveBtn').textContent='추가'}function editItem(n){let e=data.map(norm).find(x=>x.number===n);if(!e)return;editing=n;$('fNumber').value=e.number;$('fFloor').value=e.floor==='-'?'':e.floor;$('fUser').value=e.user==='미사용'?'':e.user;$('fDept').value=e.department;$('fStatus').value=e.status;$('saveBtn').textContent='수정 저장';scrollTo({top:0,behavior:'smooth'})}
function saveItem(){let number=$('fNumber').value.replace(/\D/g,'');if(!/^\d{4}$/.test(number)||+number<6000||+number>6499)return alert('내선번호는 6000~6499로 입력하세요.');if(data.some(x=>norm(x).number===number&&norm(x).number!==editing))return alert('이미 등록된 번호입니다.');let status=$('fStatus').value,item=norm({number,fullNumber:`2142-${number}`,floor:$('fFloor').value,user:$('fUser').value,department:$('fDept').value,status});if(status==='사용중'&&(!item.floor||!item.user))return alert('층과 사용자를 입력하세요.');if(editing)data=data.filter(x=>norm(x).number!==editing);data.push(item);saveLocal();clearForm();render();renderAdmin()}
function disableItem(n){data=data.map(x=>norm(x).number===n?norm({number:n,status:'미사용',user:'미사용'}):x);saveLocal();render();renderAdmin()}function deleteItem(n){if(!confirm(`${n}번을 삭제하시겠습니까?`))return;data=data.filter(x=>norm(x).number!==n);saveLocal();render();renderAdmin()}
function downloadJson(){let blob=new Blob([JSON.stringify(data.map(norm).sort((a,b)=>a.number.localeCompare(b.number,'ko',{numeric:true})),null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='extensions.json';a.click();URL.revokeObjectURL(a.href)}
function downloadTemplate(){if(!window.XLSX)return alert('엑셀 모듈을 불러오지 못했습니다.');let ws=XLSX.utils.aoa_to_sheet([['내선번호','층','사용자','부서','상태'],['6011','8F','관리 담당','영업2파트','사용중'],['6012','-','미사용','','미사용']]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'내선번호');XLSX.writeFile(wb,'내선번호_업로드양식.xlsx')}
$('excelFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{try{let wb=XLSX.read(ev.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}),map=new Map(data.map(x=>[norm(x).number,norm(x)]));rows.slice(1).forEach(row=>{let n=clean(row[0]).replace(/\D/g,'');if(/^\d{4}$/.test(n)&&+n>=6000&&+n<=6499)map.set(n,norm({number:n,floor:row[1],user:row[2],department:row[3],status:row[4]||((clean(row[2])==='미사용')?'미사용':'사용중')}))});data=[...map.values()];saveLocal();render();renderAdmin();alert('엑셀 반영 완료')}catch(err){alert('엑셀 처리 오류')}e.target.value=''};r.readAsArrayBuffer(f)};
$('jsonFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x.map(norm).filter(e=>e.number);saveLocal();render();renderAdmin();alert('JSON 반영 완료')}catch{alert('JSON 형식 오류')}e.target.value=''};r.readAsText(f,'utf-8')};
function resetLocal(){if(!confirm('GitHub의 초기 데이터로 복원하시겠습니까?'))return;localStorage.removeItem('tel_admin_data');data=[...baseData];render();renderAdmin()}
$('q').oninput=render;$('adminQ').oninput=renderAdmin;$('fStatus').onchange=()=>{if($('fStatus').value==='미사용'){$('fFloor').value='-';$('fUser').value='미사용';$('fDept').value=''}};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
fetch('./extensions.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{baseData=Array.isArray(x)?x.map(norm):[];try{let local=JSON.parse(localStorage.getItem('tel_admin_data')||'null');data=Array.isArray(local)?local.map(norm):[...baseData]}catch{data=[...baseData]}render()}).catch(()=>{$('count').textContent='데이터 오류';$('list').innerHTML='<div class="empty">extensions.json을 불러오지 못했습니다.</div>'});
</script></body></html>
